[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# אפליקציית עמוד אחד: כל נתיב חוזר ל-index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ה-service worker חייב להתעדכן מיד אחרי כל דיפלוי
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
